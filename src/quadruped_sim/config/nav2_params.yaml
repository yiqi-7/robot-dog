# Nav2 参数（四足机器人 / 厂区）
# 配合 slam_toolbox 在线建图使用，不需要静态地图

amcl:
  ros__parameters:
    use_sim_time: true
    # 四足只能前后走 + 转向，按差速模型做粒子滤波定位
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # 里程计噪声：gz 的 WORLD 真值里程计很准，可以取小一些
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.2
    alpha4: 0.05
    alpha5: 0.1
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    # 激光：360 度雷达，量程 0.12~8 m
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    # 粒子数与更新门限
    max_particles: 3000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # 由 launch 传入初始位姿；仿真里出生点已知，直接给
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: -5.6
      z: 0.0
      yaw: 1.5708
    transform_tolerance: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_loader_type: "nav2_behaviors::Spin"
    default_nav_to_pose_bt_xml: "/opt/ros/lyrical/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    robot_base_frame: base_link
    # 四足机器人可以原地踩踏调整，不用旋转恢复
    allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    # Lyrical 版 Nav2 默认发 geometry_msgs/TwistStamped，
    # 而 CHAMP / 自研步态都订阅 geometry_msgs/Twist，必须关掉带时间戳的模式
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.18
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      base_scenario: "dwb_diff_drive"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 必须大于 robot_radius(0.35)：0.35~0.70 之间是渐变软代价，
        # 机器人贴墙停稳时脚下格不再是致命 254，规划器才能起飞。
        # 【实测结论】曾把 inflation_radius 加到 0.70、cost_scaling 降到 2.0
        # 想让路径远离墙面，结果货架缝/墙洞（净宽 1.6 m）在代价图里被堵死，
        # 巡逻航点全线 error 208 规划失败。0.60 是这台机器狗（半径 0.35）
        # 能过窄通道的上限，不要再放大。
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35
      resolution: 0.05
      # 未知区当自由：静态层(地图)负责已知墙体，obstacle_layer 负责
      # 运行中新出现的障碍；若 track_unknown_space=true 且无静态层，
      # 未扫过的区域全是未知，规划器会拒绝规划
      track_unknown_space: false
      rolling_window: false
      width: 22
      height: 16
      origin_x: -11.0
      origin_y: -8.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 必须大于 robot_radius(0.35)：0.35~0.70 之间是渐变软代价，
        # 机器人贴墙停稳时脚下格不再是致命 254，规划器才能起飞。
        # 【实测结论】曾把 inflation_radius 加到 0.70、cost_scaling 降到 2.0
        # 想让路径远离墙面，结果货架缝/墙洞（净宽 1.6 m）在代价图里被堵死，
        # 巡逻航点全线 error 208 规划失败。0.60 是这台机器狗（半径 0.35）
        # 能过窄通道的上限，不要再放大。
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # 与老师示例配置一致取 true：静态地图已完整建好，未知区只在地图
      # 边缘；取 false 会让机器人从"代价被膨胀成致命"的起点直接放弃规划
      # (error 208)，反而不如允许穿过未探索边缘稳妥
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    # 同上：恢复为 geometry_msgs/Twist
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.5]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
    # 上下游话题显式写清楚，避免默认值推出环状连接：
    #   controller_server -> cmd_vel_nav -> smoother -> cmd_vel_smoothed
    #   -> collision_monitor -> cmd_vel（机器人）
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    reference_frame: "odom"
    # 关键：速度指令输出到独立话题，避免与 controller 的 Twist 抢占 /cmd_vel
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # 整条链的终点就是机器人速度指令 /cmd_vel（Twist），
    # CHAMP 与自研步态都从这里取速度
    cmd_vel_out_topic: "cmd_vel"
    frequency: 20.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_obstacle_height: 0.05
      max_obstacle_height: 1.5
      obstacle_max_range: 2.5
      obstacle_min_range: 0.0
    # 调试结论：激光 0.5~0.6 m 处的墙体回波在 TF 变换后落到多边形内，
    # 触发 stop 后不再转发任何指令（连零值都不发），整条速度链断流。
    # 先停用 polygon_stop（DW B 的 costmap 本身已含障碍层，避障不依赖它），
    # 后续如需碰撞急停再用approach多边形并核对 TF
    polygons: ["polygon_stop"]
    polygon_stop:
      type: "polygon"
      enabled: false
      action_type: "stop"
      points: "[[0.35,0.25],[0.35,-0.25],[-0.35,-0.25],[-0.35,0.25]]"
      min_points: 4

# ==================== SLAM（在线建图） ====================
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
