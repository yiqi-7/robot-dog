api: no
apiAddress: 127.0.0.1:9997
metrics: no
metricsAddress: 127.0.0.1:9998
pprof: no
pprofAddress: 127.0.0.1:9999
playback: no
playbackAddress: 127.0.0.1:9996
hls: no
rtsp: yes
rtspAddress: :8554
rtmp: no
srt: no
webrtc: yes
webrtcAddress: :8889
# 公网 IP 经 NAT 时自动探测拿到的是内网地址，必须在这里显式写对外地址，
# 否则浏览器 WHEP 建连失败。填你自己的服务器公网 IP 或域名（见 qbot.env 的 PUBLIC_IP）。
webrtcAdditionalHosts: [YOUR_PUBLIC_IP]
authInternalUsers:
  - user: any
    ips: [ ]
    permissions:
      - action: publish
      - action: read
paths:
  # 兜底路径：任意 robot id 都允许推/拉，否则换 id 时
  # MediaMTX 会拒连并打印 path 'cam/xxx' is not configured
  all_others:
  cam/robot-01:
